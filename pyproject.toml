# Configuración de herramientas Python para scripts/ (sin dependencias de runtime).
[project]
name = "agentic-stack-radar"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["scripts/radar/tests", "scripts/issues/tests", "scripts/dns/tests"]
pythonpath = ["scripts/radar", "scripts/issues", "scripts/dns"]
